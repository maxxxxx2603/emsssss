<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>EMS — Test Logs</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f0f11;--bg1:#18181c;--bg2:#222228;--bg3:#2a2a32;--bdr:rgba(255,255,255,0.07);--red:#ff3b30;--green:#30d158;--orange:#ff9f0a;--blue:#0a84ff;--purple:#bf5af2;--t1:#fff;--t2:rgba(255,255,255,0.72);--t3:rgba(255,255,255,0.38)}
body{background:var(--bg);color:var(--t1);font-family:Inter,system-ui,sans-serif;overflow-x:hidden;font-size:14px}
.topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:54px;background:rgba(15,15,17,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 20px;gap:14px}
.tb-logo{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff3b30,#ff5e52);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
.tb-title{font-size:15px;font-weight:700;flex:1}
.tb-badge{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--bdr);border-radius:20px;padding:4px 10px;font-size:11px;color:var(--t3)}
.tb-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.tb-back{color:var(--t3);text-decoration:none;font-size:12px}
.tb-back:hover{color:var(--t1)}
.statsbar{position:fixed;top:54px;left:0;right:0;z-index:190;background:var(--bg1);border-bottom:1px solid var(--bdr);display:flex;overflow-x:auto}
.stat-item{display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-right:1px solid var(--bdr);min-width:90px;flex-shrink:0}
.stat-val{font-size:18px;font-weight:700}
.stat-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-top:1px}
.stat-val.green{color:var(--green)}.stat-val.orange{color:var(--orange)}.stat-val.red{color:var(--red)}.stat-val.purple{color:var(--purple)}
.reset-info{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:11px;color:var(--t3);border-right:1px solid var(--bdr)}
.btn-reset{background:rgba(255,59,48,.15);border:1px solid rgba(255,59,48,.35);color:var(--red);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-reset:hover{background:rgba(255,59,48,.3)}
.page-wrap{margin-top:106px;display:grid;grid-template-columns:1fr 380px 320px;height:calc(100vh - 106px)}
.panel{display:flex;flex-direction:column;border-right:1px solid var(--bdr);overflow:hidden}
.panel:last-child{border-right:none}
.panel-head{padding:12px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:8px;flex-shrink:0}
.panel-head h2{font-size:12px;font-weight:700;flex:1;text-transform:uppercase;letter-spacing:.5px}
.panel-count{font-size:11px;color:var(--t3);background:var(--bg2);border-radius:10px;padding:2px 8px}
.panel-body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;border-bottom:1px solid var(--bdr);flex-shrink:0}
.tab{padding:10px 18px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t3);border-bottom:2px solid transparent;transition:all .15s}
.tab.active{color:var(--t1);border-bottom-color:var(--red)}
/* REA CARD */
.rjc{background:var(--bg1);border:1px solid var(--bdr);border-left:3px solid var(--green);border-radius:10px;overflow:hidden;flex-shrink:0}
.rjc-head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;transition:background .15s;user-select:none}
.rjc-head:hover{background:var(--bg2)}
.rjc-info{flex:1}
.rjc-nom{font-weight:700;font-size:14px}
.rjc-lic{font-size:10px;color:var(--t3);font-family:monospace;margin-top:2px}
.rjc-total{font-size:26px;font-weight:800;color:var(--green);line-height:1}
.rjc-lbl{font-size:10px;color:var(--t3);text-align:right}
.rjc-arrow{color:var(--t3);font-size:11px;transition:transform .2s;margin-left:4px}
.rjc-head.open .rjc-arrow{transform:rotate(90deg)}
.rjc-role{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600;align-self:flex-start}
.role-yes{background:rgba(48,209,88,.15);color:var(--green)}
.role-no{background:rgba(255,59,48,.15);color:var(--red)}
.rjc-detail{display:none;border-top:1px solid var(--bdr);padding:8px 12px;flex-direction:column;gap:5px}
.rjc-detail.open{display:flex}
.rjd-row{background:var(--bg2);border-radius:7px;padding:7px 10px;display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;font-size:12px}
.rjd-time{color:var(--t3);font-size:10px}
.rjd-money{color:var(--green);font-weight:700}
/* LOG CARD */
.log-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:9px;padding:10px 13px;flex-shrink:0}
.log-card.prise_service{border-left:3px solid var(--blue)}
.log-card.fin_service{border-left:3px solid var(--red)}
.lc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lc-badge{font-size:10px;font-weight:700;text-transform:uppercase;padding:3px 7px;border-radius:5px}
.prise_service .lc-badge{background:rgba(10,132,255,.15);color:var(--blue)}
.fin_service .lc-badge{background:rgba(255,59,48,.15);color:var(--red)}
.lc-time{font-size:10px;color:var(--t3);flex:1}
.lc-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;transition:color .15s}
.lc-del:hover{color:var(--red)}
.lc-row{display:grid;grid-template-columns:80px 1fr;gap:3px 10px;font-size:11px;margin-bottom:2px}
.lc-lbl{color:var(--t3);font-weight:600;text-transform:uppercase;font-size:10px}
.lc-val{color:var(--t2);word-break:break-all}
.lc-val.mono{font-family:monospace;font-size:10px;background:var(--bg2);padding:1px 4px;border-radius:3px}
/* ERROR */
.err-card{background:var(--bg1);border:1px solid rgba(255,59,48,.2);border-left:3px solid var(--red);border-radius:9px;padding:10px 13px;flex-shrink:0}
.err-reason{font-size:12px;color:var(--red);font-weight:600;margin-bottom:5px}
.err-time{font-size:10px;color:var(--t3);margin-bottom:4px}
.err-raw{font-size:10px;color:var(--t3);font-family:monospace;background:var(--bg2);padding:7px;border-radius:5px;white-space:pre-wrap;word-break:break-all;max-height:70px;overflow-y:auto}
/* REA FORM */
.rea-form{padding:12px 16px;border-bottom:1px solid var(--bdr);flex-shrink:0}
.rf-row{display:flex;gap:5px;margin-bottom:7px}
.rf-input{flex:1;background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:7px 9px;color:var(--t1);font-size:12px;font-family:inherit;outline:none}
.rf-input:focus{border-color:rgba(255,59,48,.5)}
.rf-input::placeholder{color:var(--t3)}
.rf-num{width:55px;flex:none}
.rf-btn{border:none;border-radius:7px;padding:7px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.rf-btn.add{background:rgba(48,209,88,.2);color:var(--green);border:1px solid rgba(48,209,88,.3)}
.rf-btn.add:hover{background:rgba(48,209,88,.35)}
.rf-btn.rem{background:rgba(255,59,48,.2);color:var(--red);border:1px solid rgba(255,59,48,.3)}
.rf-btn.rem:hover{background:rgba(255,59,48,.35)}
.rea-card{background:var(--bg1);border:1px solid var(--bdr);border-radius:9px;padding:10px 13px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.rea-name{font-weight:600;flex:1;font-size:13px}
.rea-lic{font-size:10px;color:var(--t3);font-family:monospace}
.rea-count{font-size:20px;font-weight:800;color:var(--green);min-width:32px;text-align:right}
.rea-del{background:none;border:none;color:var(--t3);cursor:pointer;font-size:14px;transition:color .15s}
.rea-del:hover{color:var(--red)}
.icon-btn{background:var(--bg2);border:1px solid var(--bdr);border-radius:7px;padding:4px 8px;color:var(--t2);cursor:pointer;font-size:11px;transition:all .15s}
.icon-btn:hover{background:var(--bg3)}
.icon-btn.danger:hover{background:rgba(255,59,48,.2);color:var(--red);border-color:rgba(255,59,48,.4)}
.empty{text-align:center;padding:36px 20px;color:var(--t3);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--bdr);border-radius:9px;padding:9px 18px;font-size:13px;z-index:9999;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#toast.ok{border-color:rgba(48,209,88,.4);color:var(--green)}
#toast.err{border-color:rgba(255,59,48,.4);color:var(--red)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
@media(max-width:1100px){.page-wrap{grid-template-columns:1fr 1fr}.panel:nth-child(3){grid-column:1/-1;max-height:50vh}}
@media(max-width:700px){.page-wrap{grid-template-columns:1fr}.panel{min-height:50vh}}
</style>
</head>
<body>
<div class="topbar">
  <div class="tb-logo">T</div>
  <div class="tb-title">&#129514; Test Logs &mdash; EMS</div>
  <div class="tb-badge"><span class="dot"></span> Live</div>
  <a href="/" class="tb-back">&larr; Retour</a>
</div>
<div class="statsbar">
  <div class="stat-item"><div class="stat-val green" id="sv-reas">--</div><div class="stat-lbl">R&eacute;as semaine</div></div>
  <div class="stat-item"><div class="stat-val green" id="sv-joueurs">--</div><div class="stat-lbl">Joueurs</div></div>
  <div class="stat-item"><div class="stat-val orange" id="sv-in">--</div><div class="stat-lbl">Prises svc</div></div>
  <div class="stat-item"><div class="stat-val red" id="sv-out">--</div><div class="stat-lbl">Fins svc</div></div>
  <div class="stat-item"><div class="stat-val red" id="sv-err">--</div><div class="stat-lbl">Erreurs</div></div>
  <div class="reset-info">Reset: <span id="sv-reset" style="color:var(--t2)">--</span></div>
  <div class="stat-item" style="margin-left:auto;border-left:1px solid var(--bdr);border-right:none">
    <div style="display:flex;gap:5px;align-items:center;height:100%">
      <button class="btn-reset" onclick="resetWeek()">&#128260; Reset semaine</button>
      <button class="icon-btn danger" onclick="clearTarget('all')">&#128465; Tout</button>
    </div>
  </div>
</div>
<div class="page-wrap">
  <!-- COL 1 REAS -->
  <div class="panel">
    <div class="panel-head">
      <h2>&#128137; R&eacute;as par joueur</h2>
      <span class="panel-count" id="pc-joueurs">0</span>
      <span style="font-size:10px;color:var(--t3)">cliquer pour d&eacute;tailler</span>
    </div>
    <div class="panel-body" id="reas-list"><div class="empty"><div class="empty-icon">&#128137;</div>Aucune r&eacute;a</div></div>
  </div>
  <!-- COL 2 SERVICES + ERREURS -->
  <div class="panel">
    <div class="tabs">
      <div class="tab active" data-tab="services" onclick="switchTab('services')">&#128197; Services <span id="tc-s"></span></div>
      <div class="tab" data-tab="errors" onclick="switchTab('errors')">&#128680; Erreurs <span id="tc-e"></span></div>
    </div>
    <div class="panel-body" id="services-list"></div>
    <div class="panel-body" id="errors-list" style="display:none"></div>
  </div>
  <!-- COL 3 AJOUT MANUEL -->
  <div class="panel">
    <div class="panel-head"><h2>&#43; Ajout manuel</h2><span class="panel-count" id="pc-reas">0</span></div>
    <div class="rea-form">
      <div class="rf-row">
        <input type="text" class="rf-input" id="rf-nom" placeholder="Nom du joueur" />
        <input type="text" class="rf-input" id="rf-license" placeholder="license:xxx" style="flex:1.4" />
      </div>
      <div class="rf-row">
        <input type="number" class="rf-input rf-num" id="rf-amount" value="1" min="1" />
        <input type="text" class="rf-input" id="rf-note" placeholder="Note" />
        <button class="rf-btn add" onclick="reaAction('add')">+ R&eacute;a</button>
        <button class="rf-btn rem" onclick="reaAction('remove')">&minus; R&eacute;a</button>
      </div>
    </div>
    <div class="panel-body" id="rea-list"><div class="empty"><div class="empty-icon">&#128137;</div>Aucun ajout manuel</div></div>
  </div>
</div>
<div id="toast"></div>
<script>
var allLogs=[],allErrors=[],allRea={},currentTab='services';
loadAll();
setInterval(loadAll,5000);
document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchTab(t.dataset.tab);});});
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('active',t.dataset.tab===tab);});
  document.getElementById('services-list').style.display=tab==='services'?'flex':'none';
  document.getElementById('errors-list').style.display=tab==='errors'?'flex':'none';
}
async function loadAll(){await Promise.all([loadLogs(),loadErrors(),loadRea(),loadStats()]);}
async function loadLogs(){try{var r=await fetch('/api/test/logs');var d=await r.json();allLogs=d.logs||[];renderReas();renderServices();}catch(e){}}
async function loadErrors(){try{var r=await fetch('/api/test/errors');var d=await r.json();allErrors=d.errors||[];renderErrors();}catch(e){}}
async function loadRea(){try{var r=await fetch('/api/test/rea');var d=await r.json();allRea=d.rea||{};renderReaManual();}catch(e){}}
async function loadStats(){try{
  var r=await fetch('/api/test/stats');var d=await r.json();
  document.getElementById('sv-reas').textContent=d.total_reas??'--';
  document.getElementById('sv-joueurs').textContent=d.joueurs_rea??'--';
  document.getElementById('sv-in').textContent=d.total_services_in??'--';
  document.getElementById('sv-out').textContent=d.total_services_out??'--';
  document.getElementById('sv-err').textContent=d.total_errors??'--';
  document.getElementById('sv-reset').textContent=d.last_reset||'jamais';
}catch(e){}}

function renderReas(){
  var c=document.getElementById('reas-list');
  var entries=Object.values(allRea).sort(function(a,b){return b.reas-a.reas;});
  document.getElementById('pc-joueurs').textContent=entries.length;
  if(!entries.length){c.innerHTML='<div class="empty"><div class="empty-icon">&#128137;</div>Aucune r&eacute;a</div>';return;}
  // Index ventes par license
  var ventesByLic={};
  allLogs.filter(function(l){return l.type==='vente'||l.type==='vente_importante';}).forEach(function(l){
    var lic=l.license||'';
    if(!ventesByLic[lic])ventesByLic[lic]=[];
    ventesByLic[lic].push(l);
  });
  c.innerHTML=entries.map(function(e){
    var lic=e.license||'';
    var ventes=ventesByLic[lic]||[];
    var roleOk=ventes.length>0?ventes[0].role_ok:null;
    var roleHtml=roleOk===true?'<span class="rjc-role role-yes">&#10003; R&ocirc;le</span>':roleOk===false?'<span class="rjc-role role-no">&#10007; R&ocirc;le</span>':'';
    var uid='rjc-'+(lic||e.nom||'').replace(/[^a-z0-9]/gi,'_');
    var rows=ventes.slice(0,30).map(function(l){
      return '<div class="rjd-row"><span class="rjd-time">'+esc(l.timestamp||'')+'</span><span>'+(l.type==='vente_importante'?'&#128176; Importante':'&#128230; Vente')+'</span><span class="rjd-money">'+fmoney(l.montant)+'</span></div>';
    }).join('');
    if(!rows)rows='<div style="font-size:11px;color:var(--t3);padding:4px 0">D&eacute;tails non disponibles</div>';
    var nom=e.nom||lic;
    return '<div class="rjc"><div class="rjc-head" onclick="toggleRjc(\''+uid+'\')" id="h-'+uid+'">'
      +'<div class="rjc-info"><div class="rjc-nom">'+esc(nom)+'</div>'+(lic?'<div class="rjc-lic">'+esc(lic)+'</div>':'')+'</div>'
      +(roleHtml?roleHtml+' ':'')
      +'<div style="text-align:right"><div class="rjc-total">'+e.reas+'</div><div class="rjc-lbl">r&eacute;as</div></div>'
      +'<span class="rjc-arrow">&#9654;</span></div>'
      +'<div class="rjc-detail" id="'+uid+'">'+rows+'</div></div>';
  }).join('');
}
function toggleRjc(uid){
  var d=document.getElementById(uid);var h=document.getElementById('h-'+uid);
  var o=d.classList.contains('open');
  d.classList.toggle('open',!o);h.classList.toggle('open',!o);
}
function renderServices(){
  var c=document.getElementById('services-list');
  var sv=allLogs.filter(function(l){return l.type==='prise_service'||l.type==='fin_service';});
  var tc=document.getElementById('tc-s');if(tc)tc.textContent=sv.length?'('+sv.length+')':'';
  if(!sv.length){c.innerHTML='<div class="empty"><div class="empty-icon">&#128197;</div>Aucun service</div>';return;}
  c.innerHTML=sv.map(function(log){
    var lbl=log.type==='prise_service'?'&#9989; Prise':'&#10060; Fin';
    return '<div class="log-card '+log.type+'">'
      +'<div class="lc-head"><span class="lc-badge">'+lbl+' service</span><span class="lc-time">'+esc(log.timestamp||'')+'</span>'
      +'<button class="lc-del" onclick="deleteLog('+log.id+')">&#10005;</button></div>'
      +'<div class="lc-row"><span class="lc-lbl">Joueur</span><span class="lc-val">'+esc(log.joueur)+'</span></div>'
      +(log.employee&&log.employee!==log.joueur?'<div class="lc-row"><span class="lc-lbl">Employ&eacute;</span><span class="lc-val">'+esc(log.employee)+'</span></div>':'')
      +'<div class="lc-row"><span class="lc-lbl">License</span><span class="lc-val mono">'+esc(log.license)+'</span></div>'
      +'</div>';
  }).join('');
}
function renderErrors(){
  var c=document.getElementById('errors-list');
  var tc=document.getElementById('tc-e');if(tc)tc.textContent=allErrors.length?'('+allErrors.length+')':'';
  if(!allErrors.length){c.innerHTML='<div class="empty"><div class="empty-icon">&#9989;</div>Aucune erreur</div>';return;}
  c.innerHTML=allErrors.map(function(err){
    var raw=Object.entries(err.raw_fields||{}).map(function(kv){return kv[0]+': '+kv[1];}).join('\n');
    return '<div class="err-card"><div class="err-reason">&#9888; '+esc(err.reason)+'</div>'
      +'<div class="err-time">'+(err.timestamp||'')+' &mdash; '+esc(err.raw_title||'')+'</div>'
      +(err.joueur?'<div style="font-size:11px;color:var(--t2);margin-bottom:4px">'+esc(err.joueur)+' &mdash; <code style="font-size:9px">'+esc(err.license)+'</code></div>':'')
      +(raw?'<div class="err-raw">'+esc(raw)+'</div>':'')
      +'</div>';
  }).join('');
}
function renderReaManual(){
  var c=document.getElementById('rea-list');
  var entries=Object.values(allRea).sort(function(a,b){return b.reas-a.reas;});
  document.getElementById('pc-reas').textContent=entries.length;
  if(!entries.length){c.innerHTML='<div class="empty"><div class="empty-icon">&#128137;</div>Aucun ajout manuel</div>';return;}
  c.innerHTML=entries.map(function(e){
    var key=e.license||e.nom||'';
    return '<div class="rea-card"><div style="flex:1"><div class="rea-name">'+esc(e.nom||key)+'</div>'+(e.license?'<div class="rea-lic">'+esc(e.license)+'</div>':'')+'</div><div class="rea-count">'+e.reas+'</div><button class="rea-del" onclick="deleteRea(\''+esc(key)+'\')">&#10005;</button></div>';
  }).join('');
}
async function deleteLog(id){
  if(!confirm('Supprimer ?'))return;
  var r=await fetch('/api/test/logs?id='+id,{method:'DELETE'});
  if(r.ok){toast('Supprim\u00e9','ok');loadLogs();loadStats();}else toast('Erreur','err');
}
async function reaAction(action){
  var nom=document.getElementById('rf-nom').value.trim();
  var license=document.getElementById('rf-license').value.trim();
  var amount=parseInt(document.getElementById('rf-amount').value)||1;
  var note=document.getElementById('rf-note').value.trim();
  if(!nom&&!license){toast('Nom ou license requis','err');return;}
  var r=await fetch('/api/test/rea/'+action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nom:nom,license:license,amount:amount,note:note})});
  var d=await r.json();
  if(r.ok){
    toast((action==='add'?'+':'-')+amount+' r\u00e9a pour '+(nom||license)+' (total: '+d.reas+')','ok');
    loadRea();loadStats();loadLogs();
    ['rf-nom','rf-license','rf-note'].forEach(function(id){document.getElementById(id).value='';});
    document.getElementById('rf-amount').value=1;
  }else toast(d.error||'Erreur','err');
}
async function deleteRea(key){
  if(!confirm('Supprimer r\u00e9as de '+key+' ?'))return;
  var r=await fetch('/api/test/rea/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({license:key,nom:key})});
  if(r.ok){toast('Supprim\u00e9','ok');loadRea();loadStats();}else toast('Erreur','err');
}
async function resetWeek(){
  if(!confirm('Reset semaine ? Les r\u00e9as seront archiv\u00e9es et remises \u00e0 z\u00e9ro.'))return;
  var r=await fetch('/api/test/reset-week',{method:'POST',headers:{'Content-Type':'application/json'}});
  if(r.ok){toast('Reset effectu\u00e9 \u2713','ok');loadAll();}else toast('Erreur','err');
}
async function clearTarget(target){
  if(!confirm('Vider TOUT ?'))return;
  var r=await fetch('/api/test/clear',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target:target})});
  if(r.ok){toast('Vid\u00e9','ok');loadAll();}else toast('Erreur','err');
}
function fmoney(n){return (n||0).toLocaleString('fr-FR')+' $';}
function esc(s){if(!s)return '';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var _tt;
function toast(msg,type){var el=document.getElementById('toast');el.textContent=msg;el.className='show '+type;clearTimeout(_tt);_tt=setTimeout(function(){el.className='';},3000);}
</script>
