<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMS - Test Logs</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff3b30">
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #141416;
            --bg1: #1e1e22;
            --bg2: #28282e;
            --glass: rgba(30, 30, 34, 0.88);
            --border: rgba(255, 255, 255, 0.08);
            --red: #ff3b30;
            --green: #30d158;
            --orange: #ff9f0a;
            --blue: #0a84ff;
            --t1: #ffffff;
            --t2: rgba(255, 255, 255, 0.75);
            --t3: rgba(255, 255, 255, 0.42);
        }

        body {
            background: var(--bg);
            color: var(--t1);
            font-family: 'Inter', system-ui, sans-serif;
            overflow-x: hidden;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 52px;
            background: rgba(28, 28, 30, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 0.5px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .tb-logo {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff3b30, #ff5e52);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        .tb-title {
            font-size: 16px;
            font-weight: 600;
            flex: 1;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            margin-top: 52px;
        }

        .panel {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 24px;
            backdrop-filter: blur(20px);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--t2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input,
        .form-select {
            width: 100%;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--t1);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.18s;
        }

        .form-input:focus,
        .form-select:focus {
            border-color: rgba(255, 59, 48, 0.6);
            background: var(--bg1);
            box-shadow: 0 0 0 3px rgba(255, 59, 48, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .btn {
            background: linear-gradient(135deg, #ff4035, #e0281c);
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.18s;
            width: 100%;
        }

        .btn:hover {
            box-shadow: 0 8px 24px rgba(255, 59, 48, 0.4);
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--t1);
        }

        .btn-secondary:hover {
            background: var(--bg1);
            box-shadow: none;
        }

        .btn-danger {
            background: rgba(255, 59, 48, 0.2);
            border: 1px solid rgba(255, 59, 48, 0.4);
            color: #ff3b30;
        }

        .logs-container {
            max-height: 600px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .log-item {
            background: var(--bg1);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.18s;
            position: relative;
            overflow: hidden;
        }

        .log-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: var(--blue);
        }

        .log-item.vente::before {
            background: var(--green);
        }

        .log-item.service-in::before {
            background: var(--orange);
        }

        .log-item.service-out::before {
            background: var(--red);
        }

        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .log-type {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 4px 8px;
            border-radius: 6px;
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
        }

        .log-item.vente .log-type {
            background: rgba(48, 209, 88, 0.1);
            color: #30d158;
        }

        .log-item.service-in .log-type {
            background: rgba(255, 159, 10, 0.1);
            color: #ff9f0a;
        }

        .log-item.service-out .log-type {
            background: rgba(255, 59, 48, 0.1);
            color: #ff3b30;
        }

        .log-delete {
            background: none;
            border: none;
            color: var(--t3);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            transition: color 0.18s;
        }

        .log-delete:hover {
            color: var(--red);
        }

        .log-row {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .log-label {
            font-weight: 600;
            color: var(--t3);
            text-transform: uppercase;
            min-width: 80px;
        }

        .log-value {
            color: var(--t2);
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .log-license {
            background: var(--bg2);
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--t3);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: var(--bg2);
            border-radius: 8px;
            color: var(--t2);
            cursor: pointer;
            font-size: 12px;
            transition: all 0.18s;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ff4035, #e0281c);
            border-color: #ff3b30;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--bg1);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--t1);
        }

        .stat-label {
            font-size: 11px;
            color: var(--t3);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(10, 132, 255, 0.1);
            border: 1px solid rgba(10, 132, 255, 0.3);
            border-radius: 6px;
            font-size: 11px;
            color: #0a84ff;
            margin-top: 8px;
        }

        .warning {
            background: rgba(255, 159, 10, 0.1);
            border: 1px solid rgba(255, 159, 10, 0.3);
            border-radius: 10px;
            padding: 12px;
            color: #ff9f0a;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .success {
            background: rgba(48, 209, 88, 0.1);
            border: 1px solid rgba(48, 209, 88, 0.3);
            color: #30d158;
        }

        .error-msg {
            color: #ff3b30;
            font-size: 12px;
            margin-top: 4px;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div class="topbar">
        <div class="tb-logo">T</div>
        <div class="tb-title">🧪 Test Logs - EMS</div>
        <a href="/" style="color: var(--t3); text-decoration: none; font-size: 12px;">← Retour</a>
    </div>

    <div class="container">
        <!-- FORMULAIRE -->
        <div class="panel">
            <div class="panel-title">
                ➕ Ajouter une Log
            </div>

            <div class="warning">
                ℹ️ Channel obligatoire: <code style="background: var(--bg2); padding: 2px 4px; border-radius: 4px;">1267921697420345424</code>
            </div>

            <form id="logForm">
                <div class="form-group">
                    <label class="form-label">Type de Log</label>
                    <select class="form-select" id="logType" required>
                        <option value="vente">📦 Vente</option>
                        <option value="prise_service">✅ Prise de Service</option>
                        <option value="fin_service">❌ Fin de Service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Société</label>
                    <input type="text" class="form-input" id="societe" value="ems" placeholder="ex: ems" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Joueur</label>
                        <input type="text" class="form-input" id="joueur" placeholder="ex: MoodyMoth6590" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Employé</label>
                        <input type="text" class="form-input" id="employee" placeholder="ex: amine gouiri">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">License</label>
                    <input type="text" class="form-input" id="license" placeholder="license:xxxx..." required>
                    <div class="error-msg" id="licenseError"></div>
                </div>

                <div id="venteFields" style="display: none;">
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">Montant</label>
                            <input type="number" class="form-input" id="montant" placeholder="ex: 100000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nombre de Ventes</label>
                            <input type="number" class="form-input" id="ventes" placeholder="ex: 1" min="1">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Période (min)</label>
                        <input type="number" class="form-input" id="periode" placeholder="ex: 0" min="0">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Origine</label>
                        <select class="form-select" id="origine">
                            <option value="addon_account">addon_account</option>
                            <option value="direct">direct</option>
                            <option value="autre">autre</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">User ID Discord</label>
                    <input type="text" class="form-input" id="userId" placeholder="ex: 838102445095256068" required>
                    <div class="error-msg" id="userIdError"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">Channel ID Discord</label>
                    <input type="text" class="form-input" id="channelId" placeholder="1267921697420345424" value="1267921697420345424" required>
                    <div class="error-msg" id="channelError"></div>
                </div>

                <button type="submit" class="btn">Ajouter la Log</button>
            </form>
        </div>

        <!-- AFFICHAGE DES LOGS -->
        <div class="panel">
            <div class="panel-title">
                📊 Logs (Temps Réel)
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-value" id="totalVentes">0</div>
                    <div class="stat-label">Ventes</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalServices">0</div>
                    <div class="stat-label">Services</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalMontant">0 $</div>
                    <div class="stat-label">Montant</div>
                </div>
            </div>

            <div class="filter-group">
                <button class="filter-btn active" data-filter="all">Tous</button>
                <button class="filter-btn" data-filter="vente">Ventes</button>
                <button class="filter-btn" data-filter="prise_service">Prise Service</button>
                <button class="filter-btn" data-filter="fin_service">Fin Service</button>
            </div>

            <div id="logsContainer" class="logs-container"></div>
        </div>
    </div>

    <script>
        const VALID_CHANNEL_ID = '1267921697420345424';
        const VALID_ROLE_ID = '838102445095256068';
        let logs = [];
        let currentFilter = 'all';

        // Charger les logs au démarrage
        loadLogs();

        // Événements
        document.getElementById('logForm').addEventListener('submit', addLog);
        document.getElementById('logType').addEventListener('change', updateFieldsVisibility);
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentFilter = e.target.dataset.filter;
                renderLogs();
            });
        });

        function updateFieldsVisibility() {
            const type = document.getElementById('logType').value;
            document.getElementById('venteFields').style.display = type === 'vente' ? 'block' : 'none';
        }

        async function addLog(e) {
            e.preventDefault();

            // Validations
            const license = document.getElementById('license').value;
            const userId = document.getElementById('userId').value;
            const channelId = document.getElementById('channelId').value;
            const licenseError = document.getElementById('licenseError');
            const userIdError = document.getElementById('userIdError');
            const channelError = document.getElementById('channelError');

            licenseError.textContent = '';
            userIdError.textContent = '';
            channelError.textContent = '';

            let hasError = false;

            if (!license.startsWith('license:')) {
                licenseError.textContent = 'La license doit commencer par "license:"';
                hasError = true;
            }

            if (userId !== VALID_ROLE_ID) {
                userIdError.textContent = `Le User ID doit être ${VALID_ROLE_ID}`;
                hasError = true;
            }

            if (channelId !== VALID_CHANNEL_ID) {
                channelError.textContent = `Le Channel ID doit être ${VALID_CHANNEL_ID}`;
                hasError = true;
            }

            if (hasError) return;

            const logType = document.getElementById('logType').value;
            const newLog = {
                type: logType,
                societe: document.getElementById('societe').value,
                joueur: document.getElementById('joueur').value,
                employee: document.getElementById('employee').value,
                license: license,
                userId: userId,
                channelId: channelId,
            };

            if (logType === 'vente') {
                newLog.montant = parseInt(document.getElementById('montant').value) || 0;
                newLog.ventes = parseInt(document.getElementById('ventes').value) || 1;
                newLog.periode = parseInt(document.getElementById('periode').value) || 0;
                newLog.origine = document.getElementById('origine').value;
            }

            // Envoyer au serveur
            try {
                const response = await fetch('/api/test/logs', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newLog)
                });

                if (response.ok) {
                    const result = await response.json();
                    showNotification('✅ Log ajoutée avec succès!', 'success');
                    loadLogs(); // Recharger depuis le serveur
                    document.getElementById('logForm').reset();
                    updateFieldsVisibility();
                } else {
                    const error = await response.json();
                    showNotification('❌ Erreur: ' + error.error, 'error');
                }
            } catch (err) {
                showNotification('❌ Erreur réseau', 'error');
                console.error(err);
            }
        }

        async function deleteLog(id) {
            if (!confirm('Êtes-vous sûr de vouloir supprimer cette log?')) return;
            
            try {
                const response = await fetch(`/api/test/logs?id=${id}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    showNotification('✅ Log supprimée', 'success');
                    loadLogs();
                } else {
                    showNotification('❌ Erreur de suppression', 'error');
                }
            } catch (err) {
                showNotification('❌ Erreur réseau', 'error');
            }
        }

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            const filtered = logs.filter(log => currentFilter === 'all' || log.type === currentFilter);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>Aucune log pour le moment</div>
                    </div>
                `;
                updateStats();
                return;
            }

            container.innerHTML = filtered.map(log => {
                const typeClass = log.type === 'vente' ? 'vente' : (log.type === 'prise_service' ? 'service-in' : 'service-out');
                const typeLabel = log.type === 'vente' ? '📦 Vente' : (log.type === 'prise_service' ? '✅ Prise Service' : '❌ Fin Service');

                let extra = '';
                if (log.type === 'vente') {
                    extra = `
                        <div class="log-row">
                            <span class="log-label">Montant:</span>
                            <span class="log-value">${(log.montant || 0).toLocaleString('fr-FR')} $</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Ventes:</span>
                            <span class="log-value">${log.ventes || 1}</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Période:</span>
                            <span class="log-value">${log.periode || 0} min</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Origine:</span>
                            <span class="log-value">${log.origine || 'N/A'}</span>
                        </div>
                    `;
                }

                return `
                    <div class="log-item ${typeClass}">
                        <div class="log-header">
                            <span class="log-type">${typeLabel}</span>
                            <button class="log-delete" onclick="deleteLog(${log.id})">✕</button>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Joueur:</span>
                            <span class="log-value">${log.joueur}</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Employé:</span>
                            <span class="log-value">${log.employee || 'N/A'}</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">License:</span>
                            <span class="log-value"><code class="log-license">${log.license}</code></span>
                        </div>
                        ${extra}
                        <div class="log-row">
                            <span class="log-label">Société:</span>
                            <span class="log-value">${log.societe}</span>
                        </div>
                        <div class="log-row">
                            <span class="log-label">Horodatage:</span>
                            <span class="log-value">${log.timestamp}</span>
                        </div>
                        <div class="role-badge">🔐 Role: ${log.userId}</div>
                    </div>
                `;
            }).join('');

            updateStats();
        }

        function updateStats() {
            const ventes = logs.filter(l => l.type === 'vente');
            const services = logs.filter(l => l.type === 'prise_service' || l.type === 'fin_service');
            const montantTotal = ventes.reduce((sum, l) => sum + (l.montant || 0), 0);

            document.getElementById('totalVentes').textContent = ventes.length;
            document.getElementById('totalServices').textContent = services.length;
            document.getElementById('totalMontant').textContent = (montantTotal).toLocaleString('fr-FR') + ' $';
        }

        async function loadLogs() {
            try {
                const response = await fetch('/api/test/logs');
                if (response.ok) {
                    const data = await response.json();
                    logs = data.logs || [];
                    renderLogs();
                }
            } catch (err) {
                console.error('Erreur lors du chargement des logs:', err);
            }
        }

        // Recharger les logs toutes les 5 secondes
        setInterval(loadLogs, 5000);

        function showNotification(message, type = 'success') {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 12px 20px;
                background: ${type === 'success' ? 'rgba(48, 209, 88, 0.2)' : 'rgba(255, 59, 48, 0.2)'};
                border: 1px solid ${type === 'success' ? 'rgba(48, 209, 88, 0.4)' : 'rgba(255, 59, 48, 0.4)'};
                color: ${type === 'success' ? '#30d158' : '#ff3b30'};
                border-radius: 10px;
                font-size: 14px;
                z-index: 1000;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease-out forwards';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Ajouter les animations CSS
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(400px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>

</html>
